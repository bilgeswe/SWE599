            // Handle keyboard events
            function handleKeyPress(e) {
                // Ignore if typing in an input field
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
                    return;
                }
                
                switch(e.key) {
                    case ' ':  // Space
                        e.preventDefault();
                        playPause();
                        break;
                    case 'ArrowLeft':  // Left arrow
                        e.preventDefault();
                        stepBackward();
                        break;
                    case 'ArrowRight':  // Right arrow
                        e.preventDefault();
                        stepForward();

                    case '+':

                        increaseSpeed();
                        break;
                    case '-':
                        e.preventDefault();
                        decreaseSpeed();
                        break;
                    case 'r':
                    case 'R':
                        e.preventDefault();
                        resetSimulation();
                        break;
