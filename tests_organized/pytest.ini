[tool:pytest]
# 🧪 Pytest Configuration for Üsküdar AV Simulation Project
# =========================================================

# Test discovery
testpaths = tests_organized
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    functional: Functional tests for end-to-end workflows
    performance: Performance benchmarks and timing tests
    slow: Slow tests that take more than 30 seconds
    v1_basic: Tests specific to Version 1 (basic method)
    v2_advanced: Tests specific to Version 2 (advanced method)
    requires_sumo: Tests that require SUMO installation
    requires_network: Tests that require network connectivity
    
# Test filtering examples:
# Run only unit tests: pytest -m unit
# Run only V2 tests: pytest -m v2_advanced  
# Exclude slow tests: pytest -m "not slow"
# Run integration tests for V1: pytest -m "integration and v1_basic"

# Minimum version requirements
minversion = 6.0

# Timeout for tests (in seconds)
timeout = 300

# Coverage options (when pytest-cov is installed)
# addopts = --cov=v1_basic_method --cov=v2_advanced_method --cov-report=html --cov-report=term

# Log levels
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S